name: E2E Playwright Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      EMAIL_ENABLED: false
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
      DB_NAME: assets_monitoring_test
      JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assets_monitoring_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Initialize PostgreSQL Test Database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          DB_NAME: assets_monitoring_test
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: node scripts/initialize-test-database.mjs --seed-e2e

      - name: Run E2E Smoke Suite (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          DB_NAME: assets_monitoring_test
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: npx playwright test --grep @smoke

      - name: Run Accessibility Audit (axe-core)
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          DB_NAME: assets_monitoring_test
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: npx playwright test e2e/tests/accessibility/

      - name: Run Full E2E Regression Suite (Main Push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          DB_NAME: assets_monitoring_test
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Failures & Traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
