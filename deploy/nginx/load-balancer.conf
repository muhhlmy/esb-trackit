# ESB-TrackIT High-Availability Enterprise Load Balancer Configuration
# Architecture: NGINX Reverse Proxy -> Multi-Instance Least-Connection Cluster

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for High-Throughput JSON & Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Backend Pool (Load Balancing with least_conn algorithm)
    upstream trackit_backend_cluster {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s backup;
        
        # Keepalive connections to backend workers to eliminate TCP handshake latency
        keepalive 64;
    }

    # Upstream Frontend Pool (Static SPA Delivery)
    upstream trackit_frontend_cluster {
        server frontend-1:80;
        server frontend-2:80;
        keepalive 32;
    }

    # Rate Limiting Zone for Abuse Defense
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name trackit.esb.co.id localhost;

        # Standard Security & Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Global Request Limits
        client_max_body_size 10M;
        limit_conn conn_limit 50;

        # 1. Health Probes (K8s / AWS ALB / Monitoring) - Direct low-latency pass
        location /health/ {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }

        # 2. Prometheus Metrics Endpoint
        location /metrics {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # 3. Server-Sent Events (SSE) Realtime Event Streaming
        location /api/tickets/events {
            proxy_pass http://trackit_backend_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Enterprise REST API Cluster
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Buffer tuning for high concurrency
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # 5. OpenAPI Specification
        location /openapi.json {
            proxy_pass http://trackit_backend_cluster;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # 6. Single Page Application (SPA) Frontend Reverse Proxy
        location / {
            proxy_pass http://trackit_frontend_cluster;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
