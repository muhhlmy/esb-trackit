# ==============================================================================
# ESB-TrackIT Single-Node Edge Load Balancer
# Fronts the standard docker-compose.yml stack (one backend, one frontend):
#   browser -> [this NGINX] -> /api/*  -> backend:3000 (node cluster workers)
#                          -> /*      -> frontend:80 (SPA)
#
# Enable with: docker compose --profile lb up -d
# (and remove the `ports: 80:80` mapping from the frontend service so the
#  edge LB owns the published port)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;
    reset_timedout_connection on;

    log_format edge '$request_id | $time_iso8601 | $remote_addr | $status | '
                    'upstream=$upstream_addr | rt=$request_time | urt=$upstream_response_time | '
                    '$request_method "$uri" "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Single backend node (the container itself fans out to WEB_CONCURRENCY
    # node workers via src/cluster.js). keepalive pool eliminates handshakes.
    upstream trackit_backend {
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream trackit_frontend {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    server {
        listen 80;
        listen [::]:80;
        server_name trackit.esb.co.id localhost _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        client_max_body_size 10M;
        limit_conn conn_limit 50;

        location = /health/live {
            proxy_pass http://trackit_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://trackit_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }
        location = /metrics {
            proxy_pass http://trackit_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
        # SSE realtime — unbuffered long-lived stream
        location = /api/tickets/events {
            proxy_pass http://trackit_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        location ~ ^/api/auth/(login|forgot-password|verify-reset-otp|reset-password)$ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://trackit_backend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location ~ ^/api/admin/database/restore(/validate)?/?$ {
            client_max_body_size 500m;
            proxy_pass http://trackit_backend;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location = /openapi.json {
            proxy_pass http://trackit_backend;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://trackit_backend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
        location / {
            proxy_pass http://trackit_frontend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
