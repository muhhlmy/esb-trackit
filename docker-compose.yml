services:
  postgres:
    image: postgres:16-alpine
    container_name: esb-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: ${DB_NAME:-assets_monitoring}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-assets_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esb-backend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      DB_NAME: ${DB_NAME:-assets_monitoring}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment (min 32 characters)}
      PASSWORD_BCRYPT_ROUNDS: 12
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-172.28.0.0/16}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - backups:/app/storage/backups

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esb-frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend
    ports:
      - "80:80"

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
    driver: local
  backups:
    driver: local
