services:
  load-balancer:
    image: nginx:1.27-alpine
    container_name: trackit-load-balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/load-balancer.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    networks:
      - trackit-network

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackit-backend-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - TRUST_PROXY=172.16.0.0/12,10.0.0.0/8,127.0.0.1
      - DATABASE_URL=postgres://trackit:trackit_secret@db:5432/trackit
      - WEB_CONCURRENCY=2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trackit-network

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackit-backend-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - TRUST_PROXY=172.16.0.0/12,10.0.0.0/8,127.0.0.1
      - DATABASE_URL=postgres://trackit:trackit_secret@db:5432/trackit
      - WEB_CONCURRENCY=2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trackit-network

  db:
    image: postgres:16-alpine
    container_name: trackit-db
    restart: always
    environment:
      - POSTGRES_USER=trackit
      - POSTGRES_PASSWORD=trackit_secret
      - POSTGRES_DB=trackit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackit -d trackit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trackit-network

volumes:
  pgdata:

networks:
  trackit-network:
    driver: bridge
