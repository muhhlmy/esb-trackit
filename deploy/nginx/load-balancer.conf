# ==============================================================================
# ESB-TrackIT Enterprise Edge Load Balancer — TLS Termination Profile
# Architecture: NGINX Edge (TLS) -> Least-Connection Backend Cluster
#                + Sticky (ip_hash) SSE upstream for realtime ticket events
#
# Deploy with: docker compose -f docker-compose.ha.yml up -d
# TLS: mount certs at deploy/nginx/ssl/{fullchain.pem,privkey.pem}
#      (generate a self-signed pair for staging — see deploy/nginx/ssl/README.md)
#
# Layered load balancing (full stack):
#   [1] Edge NGINX        — this file: TLS + LB + rate limits + failover
#   [2] Node cluster.js   — in-container master/worker SO_REUSEPORT LB
#   [3] pg pool           — database connection pooling
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance & network tuning ────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;
    reset_timedout_connection on;

    # Structured access log with request correlation ID + upstream traceability
    log_format edge '$request_id | $time_iso8601 | $remote_addr | $status | '
                    'upstream=$upstream_addr | rt=$request_time | urt=$upstream_response_time | '
                    '$request_method "$uri" "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;

    # ── Compression (JSON API + static assets) ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── Upstream pools ───────────────────────────────────────────────────────
    # Stateless REST traffic: least connections + passive health (max_fails).
    # A node failing 3 checks within 10s is ejected for 10s; proxy_next_upstream
    # retries the next node transparently for idempotent failures.
    upstream trackit_backend_cluster {
        least_conn;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s backup;
        keepalive 64;
    }

    # SSE realtime stream: the backend keeps an in-process client registry, so a
    # browser must stick to the instance that owns its stream. ip_hash pins each
    # client IP to one node; on node failure the client transparently
    # re-subscribes to another node (auto-reconnect is built into the frontend).
    upstream trackit_sse_cluster {
        ip_hash;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s backup;
        keepalive 16;
    }

    # SPA static delivery pool
    upstream trackit_frontend_cluster {
        least_conn;
        server frontend-1:80 max_fails=3 fail_timeout=10s;
        server frontend-2:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── Edge rate limiting (defense in depth with app-level limits) ──────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Shared proxy headers ─────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # ── HTTP (:80) — redirect everything to HTTPS ─────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name trackit.esb.co.id localhost _;

        location /health/live {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (:443) — primary entrypoint ────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name trackit.esb.co.id localhost _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Edge security headers (backend applies its own set too — layered)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        # Global request limits
        client_max_body_size 10M;
        limit_conn conn_limit 50;

        # 1. Liveness / readiness probes — direct pass, never redirected,
        #    never rate-limited (monitoring + orchestrators depend on these).
        location = /health/live {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }

        # 2. Prometheus metrics — internal monitoring scrapes
        location = /metrics {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # 3. SSE realtime stream — sticky upstream, unbuffered, long-lived
        location /api/tickets/events {
            proxy_pass http://trackit_sse_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Auth endpoints — stricter per-IP abuse limit
        location ~ ^/api/auth/(login|forgot-password|verify-reset-otp|reset-password)$ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 5. Database restore uploads — raised body limit (mirrors frontend proxy)
        location ~ ^/api/admin/database/restore(/validate)?/?$ {
            client_max_body_size 500m;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 6. OpenAPI contract — cacheable
        location = /openapi.json {
            proxy_pass http://trackit_backend_cluster;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # 7. Enterprise REST API cluster
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # High-concurrency buffering
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # 8. SPA frontend reverse proxy
        location / {
            proxy_pass http://trackit_frontend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
