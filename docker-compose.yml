services:
  postgres:
    image: postgres:16-alpine
    container_name: trackit-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: ${DB_NAME:-trackit}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trackit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackit-migrate
    restart: "no"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      DB_NAME: ${DB_NAME:-trackit}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment (min 32 characters)}
      MIGRATION_MODE: ${MIGRATION_MODE:-fresh}
      MIGRATION_EXPECTED_HOST: postgres
      MIGRATION_EXPECTED_DATABASE: ${DB_NAME:-trackit}
      ALLOW_DB_MIGRATIONS: "true"
      MIGRATION_RECOVERY_PROOF_ID: ${MIGRATION_RECOVERY_PROOF_ID:?MIGRATION_RECOVERY_PROOF_ID must be set}
      MIGRATION_CHANGE_ID: ${MIGRATION_CHANGE_ID:?MIGRATION_CHANGE_ID must be set}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - backups:/app/storage/backups
    command: ["npm", "run", "db:migrate:apply"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackit-backend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      DB_NAME: ${DB_NAME:-trackit}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment (min 32 characters)}
      PASSWORD_BCRYPT_ROUNDS: ${PASSWORD_BCRYPT_ROUNDS:-12}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      SESSION_COOKIE_PATH: ${SESSION_COOKIE_PATH:-/}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-172.28.0.0/16}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      REQUIRE_NON_SUPERUSER: ${REQUIRE_NON_SUPERUSER:-true}
      DB_BACKUP_DIR: /app/storage/backups
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-30}
      DB_BACKUP_MAX_FILES: ${DB_BACKUP_MAX_FILES:-20}
      PG_DUMP_PATH: pg_dump
      PG_RESTORE_PATH: pg_restore
      PSQL_PATH: psql
      ENABLE_DB_RESET: ${ENABLE_DB_RESET:-false}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - backups:/app/storage/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackit-frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
    driver: local
  backups:
    driver: local
