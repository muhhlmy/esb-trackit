<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESB Case — Knowledge Base & Incident Playbook</title>
  <meta name="description" content="A modern, minimalist knowledge base for internship engineering SOPs, troubleshooting, and workflows.">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- App Header Bar -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Brand Logo & Main View Nav -->
      <div class="header-left">
        <a href="#" class="brand" id="logo-home">
          <span class="brand-name">ESB Case</span>
        </a>

        <nav class="view-nav" aria-label="Main View Navigation">
          <button class="nav-tab active" data-view="all" id="tab-all">Cases <span class="tab-count" id="count-all">0</span></button>
          <button class="nav-tab" data-view="bookmarks" id="tab-bookmarks">Bookmarks <span class="tab-count" id="count-bookmarks">0</span></button>
          <button class="nav-tab" data-view="templates" id="tab-templates">Templates</button>
        </nav>
      </div>

      <!-- Header Right Controls -->
      <div class="header-right">
        <!-- Global Search -->
        <div class="search-field">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Search cases or errors..." autocomplete="off">
          <kbd class="shortcut-kbd">/</kbd>
          <button id="search-clear" class="btn-clear-search" aria-label="Clear search">&times;</button>
        </div>

        <button class="btn-new-case" id="btn-open-create">
          <i class="fa-solid fa-plus"></i>
          <span>New Case</span>
        </button>

        <button class="btn-icon-theme" id="btn-toggle-theme" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Category & Sub-Filter Bar -->
  <div class="filter-bar">
    <div class="filter-container">
      <div class="category-tabs" id="category-filters">
        <button class="cat-tab active" data-category="all">All</button>
        <button class="cat-tab" data-category="hardware">Hardware</button>
        <button class="cat-tab" data-category="git">Git</button>
        <button class="cat-tab" data-category="backend">Backend</button>
        <button class="cat-tab" data-category="environment">Environment</button>
        <button class="cat-tab" data-category="workplace">Workplace</button>
        <button class="cat-tab" data-category="devops">DevOps</button>
      </div>

      <div class="severity-filter">
        <select id="severity-select" class="select-severity" aria-label="Filter by Severity">
          <option value="all">All Severities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main Workspace Body -->
  <main class="main-workspace">
    
    <!-- VIEW 1: Master-Detail Split Workspace (Knowledge Directory & Reader) -->
    <section class="pane-view active" id="pane-cases">
      <div class="workspace-split">
        
        <!-- Master List Sidebar Pane -->
        <aside class="master-list-pane">
          <div class="list-meta-header">
            <span class="list-title" id="master-list-title">All Cases</span>
            <span class="list-count" id="filtered-count">0</span>
          </div>

          <div class="case-rows" id="case-list-master">
            <!-- Dynamic Scannable Rows rendered by app.js -->
          </div>
        </aside>

        <!-- Detail Reader Documentation Pane -->
        <article class="reader-pane" id="detail-pane-reader">
          <!-- Dynamic Document Article rendered by app.js -->
        </article>

      </div>
    </section>

    <!-- VIEW 2: Templates Hub Pane -->
    <section class="pane-view" id="pane-templates">
      <div class="templates-view-container">
        <div class="templates-header">
          <h1 class="page-heading">Templates</h1>
          <p class="page-subheading">Standard communication messages for Slack, Teams, or WhatsApp workgroups.</p>
        </div>

        <div class="templates-grid" id="templates-grid-container">
          <!-- Dynamic Templates rendered by app.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- Create Case Side-Sheet Drawer -->
  <div class="drawer-backdrop" id="create-drawer-backdrop">
    <div class="drawer-panel" role="dialog" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <h2 class="drawer-title" id="drawer-title">Create Case</h2>
        <button class="btn-close-drawer" id="btn-close-drawer" aria-label="Close drawer">&times;</button>
      </div>

      <form id="add-case-form" class="drawer-form">
        <div class="field-group">
          <label class="label" for="case-title">Title <span class="req">*</span></label>
          <input type="text" id="case-title" class="input" placeholder="e.g. SOP Setup Laptop Baru" required>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="label" for="case-category">Category <span class="req">*</span></label>
            <select id="case-category" class="select" required>
              <option value="hardware" selected>Hardware</option>
              <option value="git">Git</option>
              <option value="backend">Backend</option>
              <option value="environment">Environment</option>
              <option value="workplace">Workplace</option>
              <option value="devops">DevOps</option>
            </select>
          </div>

          <div class="field-group">
            <label class="label" for="case-severity">Severity <span class="req">*</span></label>
            <select id="case-severity" class="select" required>
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="label" for="case-summary">Summary <span class="req">*</span></label>
          <textarea id="case-summary" class="textarea" rows="3" placeholder="Brief summary of the issue..." required></textarea>
        </div>

        <div class="field-group">
          <label class="label" for="case-steps">Resolution SOP Steps <span class="req">*</span> <span class="hint">(1 line per step)</span></label>
          <textarea id="case-steps" class="textarea" rows="5" placeholder="1. Connect to network&#10;2. Run bypass command&#10;3. Execute setup script" required></textarea>
        </div>

        <div class="field-group">
          <label class="label" for="case-snippet">Command / Code Snippet</label>
          <textarea id="case-snippet" class="textarea code-font" rows="3" placeholder="powershell -Command ..."></textarea>
        </div>

        <div class="drawer-footer">
          <button type="button" class="btn-cancel" id="btn-cancel-drawer">Cancel</button>
          <button type="submit" class="btn-save">Save Case</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
