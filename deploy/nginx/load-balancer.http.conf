# ==============================================================================
# ESB-TrackIT Enterprise Load Balancer — Plain HTTP Profile
# Identical routing/failover/rate-limit policy as the TLS profile, but serves
# :80 directly (no redirect, no TLS). Use for internal deployments, staging
# behind an external TLS terminator (cloud LB / API gateway), or local docker
# compose bring-up before certificates exist.
#
# Production internet-facing deployments MUST use load-balancer.conf (TLS).
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;
    reset_timedout_connection on;

    log_format edge '$request_id | $time_iso8601 | $remote_addr | $status | '
                    'upstream=$upstream_addr | rt=$request_time | urt=$upstream_response_time | '
                    '$request_method "$uri" "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream trackit_backend_cluster {
        least_conn;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s backup;
        keepalive 64;
    }

    upstream trackit_sse_cluster {
        ip_hash;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s backup;
        keepalive 16;
    }

    upstream trackit_frontend_cluster {
        least_conn;
        server frontend-1:80 max_fails=3 fail_timeout=10s;
        server frontend-2:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    server {
        listen 80;
        listen [::]:80;
        server_name trackit.esb.co.id localhost _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        client_max_body_size 10M;
        limit_conn conn_limit 50;

        location = /health/live {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }
        location = /metrics {
            proxy_pass http://trackit_backend_cluster;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
        location = /api/tickets/events {
            proxy_pass http://trackit_sse_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        location ~ ^/api/auth/(login|forgot-password|verify-reset-otp|reset-password)$ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location ~ ^/api/admin/database/restore(/validate)?/?$ {
            client_max_body_size 500m;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location = /openapi.json {
            proxy_pass http://trackit_backend_cluster;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://trackit_backend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
        location / {
            proxy_pass http://trackit_frontend_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
