services:
  postgres:
    image: postgres:16-alpine
    container_name: esb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-assets_monitoring}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-assets_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-assets_monitoring}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_min_32_characters}
      PASSWORD_BCRYPT_ROUNDS: 12
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-TemporaryUserPass123!}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
